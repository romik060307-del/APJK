plugins { id 'com.android.application' }

android {
    namespace 'com.rk.ohlisocial'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rk.ohlisocial'
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '1.0.7'
        buildConfigField 'String', 'OHLI_URL', '"https://cartoon-advisory-stories-marion.trycloudflare.com/"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
